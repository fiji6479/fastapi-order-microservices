services:
  user-service:
    build: ./user-service
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      DB_PATH: /data/users.db
    volumes:
      - users-data:/data

  notification-service:
    build: ./notification-service
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      DB_PATH: /data/notifications.db
    volumes:
      - notifications-data:/data

  order-service:
    build: ./order-service
    depends_on:
      - user-service
      - notification-service
    ports:
      - "127.0.0.1:5002:5002"
    environment:
      DB_PATH: /data/orders.db
      USER_SERVICE_URL: http://user-service:5000
      NOTIFICATION_SERVICE_URL: http://notification-service:5001
    volumes:
      - orders-data:/data

volumes:
  users-data:
  notifications-data:
  orders-data: